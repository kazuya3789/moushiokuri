<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>申し送り</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --line:#dde3ea; --text:#1d2733; --sub:#67757f;
    --main:#0f7b6c; --main-d:#0b5f54; --warn:#c0392b; --todo:#b7791f; --chip:#eef3f5;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:"Hiragino Kaku Gothic ProN","Meiryo",system-ui,sans-serif;
       background:var(--bg); color:var(--text); font-size:16px; line-height:1.6;}
  .hide{display:none !important;}
  header{position:sticky; top:0; z-index:20; background:var(--main); color:#fff;
         padding:10px 12px; display:flex; align-items:center; gap:8px;}
  header .title{font-weight:700; font-size:16px; flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
  header .who{font-size:12px; opacity:.9; display:block; font-weight:400;}
  header button{background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:8px;
                padding:8px 10px; font-size:14px; white-space:nowrap;}
  .wrap{padding:10px 10px 96px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px;
        padding:12px; margin-bottom:10px;}
  .card.tap:active{background:#f0f5f4;}
  .meta{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--sub); margin-bottom:6px; flex-wrap:wrap;}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--main); flex:none;}
  .body{white-space:pre-wrap; word-break:break-word;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .chip{background:var(--chip); color:#3d4f5c; border-radius:6px; padding:3px 8px; font-size:12px;}
  .chip.user{background:#e6f0fb; color:#1a4f8a;}
  .chip.todo{background:#fdf1dc; color:var(--todo); font-weight:700;}
  .chip.high{background:#fdeaea; color:var(--warn); font-weight:700;}
  .chip.fix{background:#f0ece6; color:#7a6448;}
  .foot{margin-top:8px; font-size:12px; color:var(--sub); display:flex; gap:12px; flex-wrap:wrap;}
  .more{width:100%; padding:14px; border:1px dashed var(--line); background:#fff; color:var(--main);
        border-radius:12px; font-size:15px; font-weight:700;}
  .fab{position:fixed; right:16px; bottom:20px; z-index:30; width:60px; height:60px; border-radius:50%;
       background:var(--main); color:#fff; border:0; font-size:30px; box-shadow:0 4px 14px rgba(0,0,0,.25);}
  .page{position:fixed; inset:0; background:var(--bg); z-index:40; overflow-y:auto;}
  #resultPage{z-index:45;}
  #detailPage{z-index:50;}
  .page .inner{padding:12px 12px 40px;}
  label{display:block; font-size:13px; color:var(--sub); margin:12px 0 4px;}
  input,select,textarea{width:100%; padding:12px; font-size:16px; border:1px solid var(--line);
                        border-radius:10px; background:#fff; font-family:inherit;}
  textarea{min-height:150px; resize:vertical;}
  .btn{display:block; width:100%; padding:15px; background:var(--main); color:#fff; border:0;
       border-radius:10px; font-size:17px; font-weight:700; margin-top:16px;}
  .btn:active{background:var(--main-d);}
  .btn:disabled{opacity:.6;}
  .btn.sub{background:#fff; color:var(--main); border:1px solid var(--main);}
  .btn.gray{background:#fff; color:var(--sub); border:1px solid var(--line);}
  .btn.danger{background:#fff; color:var(--warn); border:1px solid #f0c6c1;}
  .row{display:flex; gap:8px;} .row>*{flex:1;}
  details.opt{margin-top:14px; border:1px solid var(--line); border-radius:10px; background:#fff; padding:10px 12px;}
  details.opt summary{color:var(--main); font-weight:700; cursor:pointer;}
  .msg{padding:10px 12px; border-radius:8px; margin:10px 0; font-size:14px; display:none;}
  .msg.err{background:#fdeaea; color:var(--warn); display:block;}
  .msg.ok{background:#e7f4ef; color:var(--main-d); display:block;}
  .empty{text-align:center; color:var(--sub); padding:40px 10px;}
  .blk{border-left:4px solid var(--line); padding:2px 0 2px 12px; margin:14px 0;}
  .blk.fix{border-color:var(--todo);} .blk.add{border-color:var(--main);}
  .blk h4{margin:0 0 4px; font-size:14px;}
  .list-item{background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:14px;}
  .sp{height:8px;}
  .loading{text-align:center; padding:20px; color:var(--sub);}
  h2{font-size:18px; margin:6px 0 0;}
  .note{font-size:12px; color:var(--sub); margin-top:6px;}
  .count{font-size:12px; color:var(--warn); text-align:right; margin-top:4px;}
  .check{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text); margin-top:14px;}
  .check input{width:auto; margin:0;}
  .adm-tabs{display:flex; gap:6px; overflow-x:auto; margin:10px 0;}
  .adm-tabs button{white-space:nowrap; border:1px solid var(--line); background:#fff; color:var(--sub);
                   border-radius:999px; padding:6px 12px; font-size:13px;}
  .adm-tabs button.on{background:var(--main); color:#fff; border-color:var(--main);}
  table{width:100%; border-collapse:collapse; font-size:12px; background:#fff;}
  td,th{border:1px solid var(--line); padding:5px; text-align:left; vertical-align:top;}
</style>
</head>
<body>

<!-- ========== ログイン ========== -->
<div id="loginPage" class="page">
  <div class="inner" style="max-width:420px; margin:0 auto; padding-top:48px;">
    <h2 id="loginTitle" style="text-align:center; margin-bottom:4px;">申し送り</h2>
    <p style="text-align:center; color:var(--sub); font-size:14px; margin-top:0;">職員名を選び、PINを入力してください</p>
    <div id="loginMsg" class="msg"></div>
    <label>職員名</label>
    <select id="loginUser"></select>
    <label>PIN（4〜8桁の数字）</label>
    <input id="loginPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
    <label class="check">
      <input type="checkbox" id="loginMine">この端末は自分専用（次回から自動でログイン）
    </label>
    <div class="note">事務所など複数人で使う端末では、チェックを外したままにしてください。しばらく操作がないと自動でログアウトします。</div>
    <button class="btn" id="loginBtn" onclick="doLogin()">ログイン</button>
  </div>
</div>

<!-- ========== 一覧 ========== -->
<div id="main" class="hide">
  <header>
    <div class="title"><span id="hdTitle">申し送り</span><span class="who" id="hdWho"></span></div>
    <button onclick="openSearch()">🔍 検索</button>
    <button onclick="openMenu()">≡</button>
  </header>
  <div class="wrap">
    <div id="listMsg" class="msg"></div>
    <div id="list"></div>
    <div id="listLoading" class="loading hide">読み込み中…</div>
    <button id="moreBtn" class="more hide" onclick="loadMore()">さらに読み込む</button>
  </div>
  <button class="fab" onclick="openPost()">＋</button>
</div>

<!-- ========== 投稿 ========== -->
<div id="postPage" class="page hide">
  <header>
    <button onclick="closePage('postPage')">← 戻る</button>
    <div class="title">申し送りを書く</div>
  </header>
  <div class="inner">
    <div id="postMsg" class="msg"></div>
    <textarea id="postBody" placeholder="ここに申し送りを入力…" oninput="countBody()"></textarea>
    <div id="postCount" class="count"></div>
    <label>勤務帯</label>
    <select id="postShift" onchange="勤務帯の案内()">
      <option value="">自動</option><option>日勤</option><option>夜勤</option></select>
    <div id="postShiftNote" class="note"></div>
    <details class="opt">
      <summary>＋ 詳しく（任意）</summary>
      <label>利用者</label>
      <select id="postUser"><option value="">（指定しない）</option></select>
      <label>分類</label>
      <select id="postCat"><option value="">（指定しない）</option></select>
      <div class="row">
        <div>
          <label>重要度</label>
          <select id="postLevel"><option>ふつう</option><option>高</option><option>低</option></select>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="postTodo">対応が必要</label>
      <label>対応期限</label>
      <input id="postDue" type="date">
    </details>
    <label>写真・動画（あとから追加もできます）</label>
    <input id="postFiles" type="file" accept="image/*,video/*" multiple onchange="ファイルを選んだ()">
    <div id="postFileList" class="note"></div>
    <div id="postProgress" class="note"></div>
    <button class="btn" id="postBtn" onclick="doPost()">送信する</button>
  </div>
</div>

<!-- ========== 詳細 ========== -->
<div id="detailPage" class="page hide">
  <header>
    <button onclick="closeDetail()">← 戻る</button>
    <div class="title">申し送りの詳細</div>
  </header>
  <div class="inner">
    <div id="detailMsg" class="msg"></div>
    <div id="detailBody"></div>
  </div>
</div>

<!-- ========== 検索 ========== -->
<div id="searchPage" class="page hide">
  <header>
    <button onclick="closePage('searchPage')">← 戻る</button>
    <div class="title">検索</div>
  </header>
  <div class="inner">
    <label>記載者</label>
    <select id="sUser"><option value="">（すべて）</option></select>
    <label>利用者</label>
    <select id="sTarget"><option value="">（すべて）</option></select>
    <label>期間</label>
    <div class="row"><input id="sFrom" type="date"><input id="sTo" type="date"></div>
    <div class="row" style="margin-top:8px;">
      <button class="btn gray" style="margin:0; padding:10px; font-size:14px;" onclick="quickRange(0)">今日</button>
      <button class="btn gray" style="margin:0; padding:10px; font-size:14px;" onclick="quickRange(1)">昨日</button>
      <button class="btn gray" style="margin:0; padding:10px; font-size:14px;" onclick="quickRange(7)">1週間</button>
      <button class="btn gray" style="margin:0; padding:10px; font-size:14px;" onclick="quickRange(90)">3か月</button>
    </div>
    <label>本文キーワード</label>
    <input id="sWord" type="text" placeholder="例：嘔吐">
    <div class="row">
      <div><label>勤務帯</label><select id="sShift"><option value="">すべて</option><option>日勤</option><option>夜勤</option></select></div>
      <div><label>重要度</label><select id="sLevel"><option value="">すべて</option><option>高</option><option>ふつう</option><option>低</option></select></div>
    </div>
    <label>分類</label>
    <select id="sCat"><option value="">（すべて）</option></select>
    <label>状態</label>
    <select id="sState"><option value="">すべて</option><option value="未対応">未対応のみ</option><option value="対応済み">対応済みのみ</option></select>
    <label class="check"><input type="checkbox" id="sUnread">自分がまだ確認していないものだけ</label>
    <button class="btn" id="searchBtn" onclick="doSearch()">検索する</button>
    <button class="btn gray" onclick="clearSearch()">条件をクリア</button>
  </div>
</div>

<!-- ========== 検索結果 ========== -->
<div id="resultPage" class="page hide">
  <header>
    <button onclick="closePage('resultPage')">← 戻る</button>
    <div class="title" id="resultTitle">検索結果</div>
  </header>
  <div class="inner">
    <div id="resultMsg" class="msg"></div>
    <div id="resultList"></div>
  </div>
</div>

<!-- ========== メニュー ========== -->
<div id="menuPage" class="page hide">
  <header>
    <button onclick="closePage('menuPage')">← 戻る</button>
    <div class="title">メニュー</div>
  </header>
  <div class="inner">
    <div class="card"><b id="menuName"></b><div style="color:var(--sub); font-size:13px;" id="menuRole"></div></div>
    <button class="btn sub" id="adminBtn" onclick="openAdmin()">管理画面</button>
    <button class="btn gray" onclick="doLogout()">ログアウト（職員を切り替える）</button>
  </div>
</div>

<!-- ========== 管理 ========== -->
<div id="adminPage" class="page hide">
  <header>
    <button onclick="closePage('adminPage')">← 戻る</button>
    <div class="title">管理画面</div>
  </header>
  <div class="inner">
    <div class="adm-tabs">
      <button data-adm="staff" class="on" onclick="setAdm('staff')">職員</button>
      <button data-adm="user" onclick="setAdm('user')">利用者</button>
      <button data-adm="qr" onclick="setAdm('qr')">QRカード</button>
      <button data-adm="hidden" onclick="setAdm('hidden')">非表示一覧</button>
      <button data-adm="log" onclick="setAdm('log')">監査ログ</button>
      <button data-adm="err" onclick="setAdm('err')">エラー</button>
      <button data-adm="csv" onclick="setAdm('csv')">CSV出力</button>
      <button data-adm="setting" onclick="setAdm('setting')">設定</button>
    </div>
    <div id="admMsg" class="msg"></div>
    <div id="admBody"></div>
  </div>
</div>

<script>
// 申し送りのデータを預かっている場所（Googleのスプレッドシート側）
var データの置き場 = 'https://script.google.com/macros/s/AKfycbxhpt8W_xOsgFBy7jQl3cYCMOsV8UsTS_zjzfZJuwgh08N8RB7B9UVIsyjjLZgsmvI/exec';
// QRカードから開いたときは、URLの ?k= に合言葉が入っている
var 埋込QRキー = (function(){
  var m = String(location.search || '').match(/[?&]k=([A-Za-z0-9]{16,64})/);
  return m ? m[1] : '';
})();
// 最初の1往復でまとめてもらう
var 埋込データ = null;

// ===== 保存領域（使えない環境でも落ちないようにする）=====
var 記憶 = (function(){
  var 使える = false, 控え = {};
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); 使える = true; } catch(e){ 使える = false; }
  return {
    get: function(k){ try { return 使える ? localStorage.getItem(k) : (控え[k]||null); } catch(e){ return 控え[k]||null; } },
    set: function(k,v){ try { 使える ? localStorage.setItem(k,v) : (控え[k]=v); } catch(e){ 控え[k]=v; } },
    del: function(k){ try { 使える ? localStorage.removeItem(k) : delete 控え[k]; } catch(e){ delete 控え[k]; } }
  };
})();

/**
 * サーバーへのお願いは、すべてここを通る。
 * Content-Type を text/plain にしているのは、そうしないとブラウザが
 * 事前確認（preflight）を出し、Googleがそれに答えないため弾かれるから。
 */
function call(fn){
  var args = Array.prototype.slice.call(arguments,1);
  return fetch(データの置き場, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ 関数: fn, 引数: args })
  }).then(function(r){
    if(!r.ok) throw new Error('つながりませんでした（' + r.status + '）');
    return r.json();
  }).then(function(j){
    if(j && j.ok) return j.結果;
    throw new Error((j && j.訳) || '処理できませんでした');
  });
}
function show(id, text, type){
  var el = document.getElementById(id);
  el.className = 'msg ' + (type||'err');
  el.textContent = text || '';
  if(!text) el.className='msg';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function safeId(s){ return /^[A-Za-z0-9\-]+$/.test(String(s)) ? String(s) : ''; }
function uuid(){
  return 'r-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10);
}
/** セッション切れならログイン画面へ戻す */
function 切れた(e){
  var m = (e && e.message) || '';
  if(/ログインしてください|有効期限|操作がなかった|利用停止/.test(m)){
    端末の控えを消す_();
    location.reload();
    return true;
  }
  return false;
}

/**
 * 合言葉を捨てるときは、端末に残した控えもまとめて捨てる（B3・2026-08-19）
 *   ms_token  … 合言葉
 *   ms_maegai … 前回の一覧（**申し送りの本文が入っている**）。外に置いた画面だけが使う
 */
function 端末の控えを消す_(){
  記憶.del('ms_token');
  記憶.del('ms_maegai');
}
var ST = { token:null, me:null, conf:null, users:[], staff:[], tab:'all', cursor:null, busy:false, detailId:null, 一覧:[] };

window.addEventListener('load', function(){
  // 画面はもう出ている。ここから1往復だけして中身を入れる
  var 覚えているtoken = 記憶.get('ms_token') || '';
  if(埋込QRキー || 覚えているtoken){
    show('loginMsg', '読み込んでいます…', 'ok');
  }
  // 前に開いたときの内容が端末に残っていれば、待たずにそのまま出す（すぐ差し替わる）
  var 前回 = null;
  try { 前回 = JSON.parse(記憶.get('ms_maegai') || 'null'); } catch(e){ 前回 = null; }
  if(覚えているtoken && 前回 && 前回.ログイン && 前回.先読み){
    ST.token = 覚えているtoken;
    前回.ログイン.token = 覚えているtoken;
    afterLogin(前回.ログイン, 前回.先読み);
    show('listMsg', '最新を確認しています…', 'ok');
  }
  call('初期表示', 埋込QRキー, 覚えているtoken).then(function(d){
    埋込データ = d || null;
    show('loginMsg','');
    // 次に開いたときのために控えておく（合言葉やPINは入っていない）
    try {
      if(d && d.ログイン && d.先読み){
        記憶.set('ms_maegai', JSON.stringify({ ログイン: { 職員: d.ログイン.職員, 設定: d.ログイン.設定 }, 先読み: d.先読み }));
      }
    } catch(e){}
    ST.cursor = null;
    document.getElementById('list').innerHTML = '';
    始める();
  }).catch(function(e){
    show('loginMsg', '読み込めませんでした：' + ((e && e.message) || '') + '　もう一度開き直してください');
  });
});

function 始める(){
  // ①QRカードから開いた場合＝サーバー側でログインまで済ませてある
  if(埋込データ && 埋込データ.ログイン){
    ST.token = 埋込データ.ログイン.token;
    記憶.set('ms_token', ST.token);
    afterLogin(埋込データ.ログイン, 埋込データ.先読み);
    return;
  }
  // ②QRで入れなかった場合は、理由を出してふつうのログイン画面へ
  if(埋込データ && 埋込データ.入れなかった){
    端末の控えを消す_();
    showLogin();
    show('loginMsg', 埋込データ.入れなかった);
    return;
  }
  // ③前に入ったことがある端末＝確認と一覧取得をまとめて1往復で済ませる
  // ③前に入ったことがある端末＝上の1往復でログイン済みの中身が返ってきている
  ST.token = 記憶.get('ms_token');
  if(ST.token && !(埋込データ && 埋込データ.ログイン)){
    // 合言葉が通らなかった＝端末に残した前回の一覧（本文入り）もここで捨てる（B3）
    端末の控えを消す_();
    ST.token = null;
  }
  showLogin();
}

function 職員名を並べる(r){
  document.getElementById('loginTitle').textContent = r.施設名 + '　申し送り';
  document.getElementById('loginUser').innerHTML =
    r.職員.map(function(s){ return '<option value="'+esc(s.id)+'">'+esc(s.氏名)+'</option>'; }).join('');
}
function showLogin(静かに){
  if(!静かに){
    document.getElementById('loginPage').classList.remove('hide');
    document.getElementById('main').classList.add('hide');
  }
  // 職員名はページに埋め込んである。サーバーへ聞きに行かないぶん、すぐ出る
  if(埋込データ && 埋込データ.職員 && 埋込データ.職員.length){ 職員名を並べる(埋込データ); return; }
  call('職員一覧').then(職員名を並べる)
    .catch(function(e){ show('loginMsg', (e && e.message) || '読み込みに失敗しました'); });
}

function doLogin(){
  var id = document.getElementById('loginUser').value;
  var pin = document.getElementById('loginPin').value;
  var mine = document.getElementById('loginMine').checked;
  if(!/^\d{4,8}$/.test(pin)){ show('loginMsg','PINは4〜8桁の数字です'); return; }
  var btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '確認中…';
  show('loginMsg','');
  call('ログイン', id, pin, mine).then(function(r){
    btn.disabled = false; btn.textContent = 'ログイン';
    ST.token = r.token;
    記憶.set('ms_token', r.token);
    document.getElementById('loginPin').value='';
    afterLogin(r);
  }).catch(function(e){
    btn.disabled = false; btn.textContent = 'ログイン';
    show('loginMsg', (e && e.message) || 'ログインできませんでした');
  });
}

function afterLogin(r, 先読み){
  ST.me = r.職員; ST.conf = r.設定;
  document.getElementById('loginPage').classList.add('hide');
  document.getElementById('main').classList.remove('hide');

function setTab(t){ ST.tab = t || 'all'; reload(); }
function reload(){
  ST.cursor = null;
  document.getElementById('list').innerHTML = '';
  document.getElementById('moreBtn').classList.add('hide');
  loadMore();
}
function loadMore(){
  if(ST.busy) return;
  ST.busy = true;
  document.getElementById('listLoading').classList.remove('hide');
  call('一覧取得', ST.token, { cursor: ST.cursor, tab: ST.tab }).then(一覧を描く).catch(function(e){

function 一覧を描く(r){
  ST.busy = false;
  document.getElementById('listLoading').classList.add('hide');
  show('listMsg','');
  var box = document.getElementById('list');
  if(!r.items.length && !ST.cursor){
    box.innerHTML = '<div class="empty">申し送りはまだありません。<br>右下の「＋」から書けます。</div>';
  } else {
    box.insertAdjacentHTML('beforeend', r.items.map(cardHtml).join(''));
  }
  // いま画面に出ている申し送りを手元に持っておく（開くときに待たせないため）
  ST.一覧 = ST.cursor ? (ST.一覧 || []).concat(r.items) : r.items.slice();
  ST.cursor = r.next;
  document.getElementById('moreBtn').classList.toggle('hide', !r.next);

function cardHtml(d){
  var chips = '';
  if(d.利用者名) chips += '<span class="chip user">'+esc(d.利用者名)+'</span>';
  if(d.分類) chips += '<span class="chip">'+esc(d.分類)+'</span>';
  if(d.重要度==='高') chips += '<span class="chip high">重要</span>';
  if(d.要対応) chips += '<span class="chip todo">'+(d.対応状況==='対応済み'?'対応済み':'要対応')+'</span>';
  if(d.訂正一致) chips += '<span class="chip fix">訂正・追記が一致</span>';
  if(d.添付数) chips += '<span class="chip">📎写真・動画'+d.添付数+'</span>';
  var body = String(d.本文||'');
  var short = body.length > 90 ? body.slice(0,90)+'…' : body;
  var id = safeId(d.id);
  return '<div class="card tap" onclick="openDetail(\''+id+'\')">'
    + '<div class="meta">'
    + (d.自分既読 ? '' : '<span class="dot"></span>')
    + '<span>'+esc(d.投稿日時)+'</span><span>'+esc(d.勤務帯)+'</span><span>'+esc(d.記載者名)+'</span></div>'
    + '<div class="body">'+esc(short)+'</div>'
    + (chips ? '<div class="chips">'+chips+'</div>' : '')
    + '<div class="foot"><span>✔確認 '+(d.既読数||0)+'人</span>'
    + (d.子件数 ? '<span>💬訂正・追記 '+d.子件数+'件</span>' : '') + '</div></div>';
}

var 受付ID = null, 送信回数 = 0;
function openPost(){
  // 前に書いた人の選択が残ったままにならないよう、毎回「自動」に戻す
  document.getElementById('postShift').value = '';
  勤務帯の案内();
  送信回数 = 0;   // 送り直しかどうかを数える（C4）
  document.getElementById('postBody').value='';
  document.getElementById('postCount').textContent='';
  show('postMsg','');
  受付ID = uuid();
  document.getElementById('postPage').classList.remove('hide');
  setTimeout(function(){ document.getElementById('postBody').focus(); }, 100);
}
function closePage(id){ document.getElementById(id).classList.add('hide'); }
/**
 * その時刻（0時からの分）が日勤かどうか。
 * ★サーバーの 日勤か_ と**同じ中身にしておくこと**（B5・B6・2026-08-19）。
 *   開始>終了は「日をまたぐ」（22:00〜6:00）。ずれていないかは検査で見張っている
 */
function 日勤か_(m, a, b){
  if(a === b) return false;
  if(a < b) return m >= a && m < b;
  return m >= a || m < b;
}
/** いま「自動」だとどちらで記録されるかを出す（18時ちょうどから夜勤になるため） */
function いまの勤務帯_(){
  var c = ST.conf || {};
  if(c.日勤開始 == null || c.日勤終了 == null) return null;
  var d = new Date();
  var m = d.getHours()*60 + d.getMinutes();
  return 日勤か_(m, c.日勤開始, c.日勤終了) ? '日勤' : '夜勤';
}
function 分を時刻_(m){
  if(m == null) return '';
  var h = Math.floor(m/60), f = m%60;
  return h + ':' + (f<10?'0':'') + f;
}
function 勤務帯の案内(){
  var 枠 = document.getElementById('postShiftNote');
  if(!枠) return;
  var 選 = document.getElementById('postShift').value;
  if(選){ 枠.textContent = 'この申し送りは「' + 選 + '」として記録します。'; return; }
  var いま = いまの勤務帯_();
  var c = ST.conf || {};
  枠.textContent = いま
    ? '自動＝いま書くと「' + いま + '」になります（日勤は '
      + 分を時刻_(c.日勤開始) + '〜' + 分を時刻_(c.日勤終了) + '）。違うときは選び直してください。'
    : '自動＝書いた時刻で決まります。違うときは選び直してください。';
}
function countBody(){
  var 上限 = (ST.conf && ST.conf.本文上限) || 5000;
  var n = document.getElementById('postBody').value.length;
  var el = document.getElementById('postCount');
  el.textContent = (n > 上限 - 500) ? ('あと ' + (上限 - n) + ' 文字') : '';
}
function doPost(){
  var body = document.getElementById('postBody').value;
  var 上限 = (ST.conf && ST.conf.本文上限) || 5000;
  if(!body.trim()){ show('postMsg','申し送りの内容を入力してください'); return; }
  if(body.length > 上限){ show('postMsg','本文が長すぎます（'+body.length+'文字／上限'+上限+'文字）'); return; }
  var btn = document.getElementById('postBtn');
  btn.disabled = true; btn.textContent = '送信中…';
  送信回数++;   // 2回目以降は「送り直し」としてサーバーに伝える（C4）
  call('投稿', ST.token, {
    本文: body,
    利用者ID: document.getElementById('postUser').value,
    分類: document.getElementById('postCat').value,
    重要度: document.getElementById('postLevel').value,
    勤務帯: document.getElementById('postShift').value,
    送り直し: (送信回数 > 1),
    要対応: document.getElementById('postTodo').checked,
    対応期限: document.getElementById('postDue').value
  }, 受付ID).then(function(id){
    btn.textContent='写真・動画を送信中…';
    return 添付をまとめて送る(id);
  }).then(function(){
    btn.disabled=false; btn.textContent='送信する';
    document.getElementById('postUser').value='';
    document.getElementById('postCat').value='';
    document.getElementById('postTodo').checked=false;
    document.getElementById('postDue').value='';
    document.getElementById('postBody').value='';
    closePage('postPage');
    reload();
    window.scrollTo(0,0);
  }).catch(function(e){
    btn.disabled=false; btn.textContent='送信する';
    if(切れた(e)) return;
    show('postMsg', ((e && e.message) || '送信できませんでした')
      + '　※入力内容は残っています。もう一度「送信する」を押しても二重登録にはなりません。');
  });
}

/** 一覧に届いている情報だけで、先に詳細を組み立てる（サーバーを待たない） */
function 手元の詳細_(id){
  var d = (ST.一覧 || []).filter(function(x){ return String(x.id) === String(id); })[0];
  if(!d) return null;
  return { 本体: d, 子: [], 既読者: [], 自分既読: !!d.自分既読,
           自己修正可: false, 修正回数: 0, 管理者: !!(ST.me && ST.me.権限==='管理者'), 途中: true };

function openDetail(id, 済ませた文){
  id = safeId(id);
  if(!id) return;
  ST.detailId = id;
  document.getElementById('detailBody').innerHTML = '<div class="loading">読み込み中…</div>';
  show('detailMsg','');
  document.getElementById('detailPage').classList.remove('hide');

  if(手元){ renderDetail(手元); show('detailMsg','最新を確認しています…','ok'); }

    ST.detailId = r.本体.id;

function renderDetail(r){
  var d = r.本体;
  var h = '<div class="card"><div class="blk"><h4>【元の記載】'+esc(d.投稿日時full)+'　'+esc(d.記載者名)+'（'+esc(d.勤務帯)+'）</h4>'
        + '<div class="body">'+esc(d.本文)+'</div>';
  var chips='';
  if(d.利用者名) chips += '<span class="chip user">'+esc(d.利用者名)+'</span>';
  if(d.分類) chips += '<span class="chip">'+esc(d.分類)+'</span>';
  if(d.重要度==='高') chips += '<span class="chip high">重要</span>';
  if(d.要対応) chips += '<span class="chip todo">'+(d.対応状況==='対応済み'?'対応済み '+esc(d.対応情報):'要対応'+(d.対応期限?'（期限 '+esc(d.対応期限)+'）':''))+'</span>';
  if(chips) h += '<div class="chips">'+chips+'</div>';
  if(r.修正回数) h += '<div class="note">※この記録は投稿直後に'+r.修正回数+'回修正されています（変更前の全文は版履歴に保存）</div>';
  h += '</div>';
  r.子.forEach(function(c){
    h += '<div class="blk '+(c.種別==='訂正'?'fix':'add')+'"><h4>【'+esc(c.種別)+'】'+esc(c.投稿日時full)+'　'+esc(c.記載者名)+'</h4>'
       + '<div class="body">'+esc(c.本文)+'</div></div>';
  });
  h += '<div class="foot" style="margin-top:12px;">✔確認済み：'
     + (r.既読者.length ? r.既読者.map(function(x){return esc(x.氏名);}).join('・') + '（'+r.既読者.length+'人）' : 'まだいません')
     + '</div></div>';

  h += '<button class="btn sub" onclick="openAddBox(\'追記\')">追記する</button>';
  h += '<button class="btn sub" onclick="openAddBox(\'訂正\')">訂正する</button>';
  if(d.要対応 && d.対応状況 !== '対応済み')
    h += '<button class="btn" id="doneBtn" onclick="doDone()">対応済みにする</button>';
  if(r.自己修正可)
    h += '<button class="btn gray" onclick="openSelfEdit()">自分の記載を修正する（投稿直後のみ）</button>';
  if(r.管理者 || (ST.me && String(d.記載者ID) === String(ST.me.id))){
    h += '<div class="list-item" style="margin-top:10px;"><b>勤務帯</b>'
       + '<div class="note" style="margin:4px 0;">いまは「' + esc(d.勤務帯) + '」で記録されています。'
       + '違っていれば直せます（直したことは記録に残ります）。</div>'
       + '<select id="shiftFix">'
       + '<option' + (d.勤務帯==='日勤'?' selected':'') + '>日勤</option>'
       + '<option' + (d.勤務帯==='夜勤'?' selected':'') + '>夜勤</option></select>'
       + '<button class="btn gray" style="margin-top:8px;" onclick="doShiftFix()">この勤務帯に直す</button></div>';
  }
  if(r.管理者)
    h += '<button class="btn danger" onclick="doHide()">非表示にする（管理者）</button>';
  h += '<div id="添付欄" style="margin-top:14px;"></div>';
  h += '<div id="addBox" class="hide" style="margin-top:16px;">'
     + '<label id="addLabel">追記</label><textarea id="addBody" style="min-height:110px;"></textarea>'
     + '<button class="btn" id="addBtn" onclick="doAdd()">保存する</button></div>';
  document.getElementById('detailBody').innerHTML = h;
  if(ST.detailId) 添付を描く(ST.detailId);
}

function quickRange(days){
  var t = new Date(), f = new Date();
  if(days===1){ t.setDate(t.getDate()-1); f.setDate(f.getDate()-1); }
  else f.setDate(f.getDate()-days);
  var s = function(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); };
  document.getElementById('sFrom').value = s(f);
  document.getElementById('sTo').value = s(t);
}

    記載者ID: document.getElementById('sUser').value,
    利用者ID: document.getElementById('sTarget').value,
    開始日: document.getElementById('sFrom').value,

    重要度: document.getElementById('sLevel').value,
    分類: document.getElementById('sCat').value,
    対応状況: document.getElementById('sState').value,
    未確認: document.getElementById('sUnread').checked
  };
  var btn = document.getElementById('searchBtn');
  btn.disabled = true; btn.textContent = '検索中…';
  document.getElementById('resultList').innerHTML = '<div class="loading">検索中…</div>';
  document.getElementById('resultPage').classList.remove('hide');
  call('検索', ST.token, cond).then(function(r){
    btn.disabled = false; btn.textContent = '検索する';
    document.getElementById('resultTitle').textContent = '検索結果 ' + r.items.length + '件';
    document.getElementById('resultList').innerHTML = r.items.length
      ? r.items.map(cardHtml).join('')
      : '<div class="empty">条件に合う申し送りはありませんでした。</div>';
    show('resultMsg', r.打ち切り ? '件数が多いため300件までを表示しています。条件を絞ってください。' : '', 'ok');
  }).catch(function(e){
    btn.disabled = false; btn.textContent = '検索する';
    if(切れた(e)) return;
    document.getElementById('resultList').innerHTML='';
    show('resultMsg', (e && e.message) || '検索に失敗しました');
  });
}

var 選んだファイル = [];

function ファイルを選んだ(){
  var 入 = document.getElementById('postFiles');

function 大きさの表示(n){
  if(n >= 1024*1024) return (n/1024/1024).toFixed(1) + 'MB';
  return Math.max(1, Math.round(n/1024)) + 'KB';
}

/** 写真は長辺1600pxに縮めてから送る（通信量とドライブの容量を抑えるため） */
function 写真を縮める(file){
  return new Promise(function(ok){
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      var 長辺 = Math.max(img.width, img.height);
      var 倍 = 長辺 > 1600 ? 1600/長辺 : 1;
      var c = document.createElement('canvas');
      c.width = Math.round(img.width*倍); c.height = Math.round(img.height*倍);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function(b){
        URL.revokeObjectURL(url);
        ok({ 中身: b || file, 見本: 見本を作る(c) });
      }, 'image/jpeg', 0.85);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); ok({ 中身: file, 見本: '' }); };
    img.src = url;
  });
}

/** 動画は1コマ目を見本にする（実物は縮めない） */
function 動画の見本(file){
  return new Promise(function(ok){
    var v = document.createElement('video');
    var url = URL.createObjectURL(file);
    var 終わった = false;
    var 片づけ = function(見本){ if(終わった) return; 終わった = true; URL.revokeObjectURL(url); ok({ 中身: file, 見本: 見本 }); };
    v.preload = 'metadata'; v.muted = true; v.playsInline = true;
    v.onloadeddata = function(){
      try {
        var c = document.createElement('canvas');
        var 倍 = Math.min(1, 320/Math.max(v.videoWidth||320, 1));
        c.width = Math.round((v.videoWidth||320)*倍); c.height = Math.round((v.videoHeight||240)*倍);
        c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
        片づけ(見本を作る(c));
      } catch(e){ 片づけ(''); }
    };
    v.onerror = function(){ 片づけ(''); };
    setTimeout(function(){ 片づけ(''); }, 8000);
    v.src = url;
  });
}

function 見本を作る(canvas){
  try {
    var c = document.createElement('canvas');
    var 倍 = Math.min(1, 320/Math.max(canvas.width, 1));
    c.width = Math.round(canvas.width*倍); c.height = Math.round(canvas.height*倍);
    c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.7);
  } catch(e){ return ''; }
}

function かけらを読む(blob){
  return new Promise(function(ok, ng){
    var r = new FileReader();
    r.onload = function(){ ok(String(r.result).split(',')[1] || ''); };
    r.onerror = function(){ ng(new Error('ファイルを読めませんでした')); };
    r.readAsDataURL(blob);
  });
}

/**
 * 1つ送る。
 * まず「受け取り札」を使ってGoogleへ直接送る（速い）。
 * それができない環境なら、いままでどおりサーバー経由に切り替える（遅いが確実）。
 */
function 添付を1つ送る(申し送りID, file, 進捗){
  var 写真か = /^image\//.test(file.type);
  var 下ごしらえ = 写真か ? 写真を縮める(file) : 動画の見本(file);
  var 本体, 見本, 受付, ドライブID = '', 送れた量 = 0;

  function 直接送る(){
    if(!受付.口) return Promise.reject(new Error('受け取り札がありません'));
    var 位置 = 0;
    function 次(){
      if(位置 >= 本体.size) return Promise.resolve();
      var 端 = Math.min(位置 + 受付.かけら, 本体.size);
      return fetch(受付.口, {
        method: 'PUT',
        headers: { 'Content-Range': 'bytes ' + 位置 + '-' + (端-1) + '/' + 本体.size },
        body: 本体.slice(位置, 端)
      }).then(function(r){
        if(r.status === 308){
          位置 = 端; 送れた量 = 位置;
          進捗(Math.round(位置*100/本体.size));
          return 次();
        }
        if(r.status === 200 || r.status === 201){
          return r.json().then(function(j){
            ドライブID = j.id; 送れた量 = 本体.size; 進捗(100);
          });
        }
        throw new Error('直接送れませんでした（' + r.status + '）');
      });
    }
    return 次();
  }

  function サーバー経由で送る(){
    var 位置 = 0;
    function 次(){
      if(位置 >= 本体.size) return Promise.resolve();
      var 端 = Math.min(位置 + 受付.かけら, 本体.size);
      return かけらを読む(本体.slice(位置, 端)).then(function(b64){
        return call('添付_かけら', ST.token, 受付.受付ID, 位置, b64);
      }).then(function(r){
        位置 = r.完了 ? 本体.size : r.受け取った;
        進捗(Math.round(位置*100/本体.size));
        return 次();
      });
    }
    return 次();
  }

  return 下ごしらえ.then(function(r){
    本体 = r.中身; 見本 = r.見本;
    // location.origin ＝ この画面がどこに置かれているか。
    // これを伝えておかないと、Googleが直接の受け取りを断る
    return call('添付_開始', ST.token, 申し送りID, 写真か?'写真':'動画',
                file.name, 本体.size, 本体.type || file.type, location.origin);
  }).then(function(r){
    受付 = r;
    return 直接送る().catch(function(e){
      // 1バイトも送れていないときだけ、安全に切り替えられる
      if(送れた量 > 0) throw e;
      return サーバー経由で送る();
    });
  }).then(function(){
    return call('添付_登録', ST.token, 受付.受付ID, 見本, ドライブID);
  });
}

/** 選んだものを順に送る */
function 添付をまとめて送る(申し送りID){
  if(!選んだファイル.length) return Promise.resolve();
  var 全 = 選んだファイル.length;
  var 表示 = document.getElementById('postProgress');
  var p = Promise.resolve();
  選んだファイル.forEach(function(f, i){
    p = p.then(function(){
      return 添付を1つ送る(申し送りID, f, function(割合){
        表示.textContent = '写真・動画を送っています（' + (i+1) + '／' + 全 + '）　' + 割合 + '%';
      });
    });
  });
  return p.then(function(){
    表示.textContent = '';
    選んだファイル = [];
    var 入 = document.getElementById('postFiles'); if(入) 入.value = '';
    document.getElementById('postFileList').textContent = '';
  }).catch(function(e){
    表示.textContent = '';
    throw new Error('本文は保存できましたが、写真・動画を送れませんでした（' + ((e && e.message)||'') + '）。詳細画面からもう一度お試しください。');
  });
}

/** 詳細画面に添付を描く */
function 添付を描く(申し送りID){
  var 箱 = document.getElementById('添付欄');
  if(!箱) return;
  call('添付一覧', ST.token, 申し送りID).then(function(rows){
    if(!rows.length){ 箱.innerHTML = ''; return; }
    箱.innerHTML = '<label>写真・動画（' + rows.length + '件）</label><div id="添付並び"></div>';
    var 並び = document.getElementById('添付並び');
    並び.innerHTML = rows.map(function(a){
      var i = esc(a.id);
      return '<div class="list-item" id="添付_'+i+'">'
        + '<div style="color:var(--sub); font-size:12px;">'+esc(a.種類)+'　'+esc(a.ファイル名)
        + '　'+ (a.大きさ>=1048576 ? (a.大きさ/1048576).toFixed(1)+'MB' : Math.round(a.大きさ/1024)+'KB') +'</div>'
        + '<div id="見本_'+i+'" style="margin:6px 0;"></div>'
        + (a.いま見られる
            ? '<button class="btn gray" style="margin:0; padding:8px; font-size:13px;" onclick="添付を開く(\''+i+'\',\''+esc(a.種類)+'\')">'
              + (a.種類==='写真'?'大きく見る':'再生する') + '</button>'
            : '<div style="color:var(--sub); font-size:12px;">'+esc(a.状態)+'</div>'
              + (ST.me && ST.me.権限==='管理者'
                 ? '<div class="sp"></div><button class="btn gray" style="margin:0; padding:8px; font-size:13px;" onclick="添付を取り出す(\''+i+'\')">事務所のPCから取り出す</button>'
                 : '<div class="note">見たいときは管理者に取り出しを依頼してください。</div>'))
        + '<div id="実物_'+i+'" style="margin-top:8px;"></div>'
        + '</div>';
    }).join('');
    rows.forEach(function(a){
      if(!a.見本あり) return;
      call('添付_見本', ST.token, a.id).then(function(d){
        if(d) document.getElementById('見本_'+a.id).innerHTML =
          '<img src="'+d+'" style="max-width:160px; border-radius:8px;">';
      }).catch(function(){});
    });
  }).catch(function(e){ if(!切れた(e)) 箱.innerHTML = '<div class="note">'+esc((e&&e.message)||'')+'</div>'; });
}

function 添付を開く(id, 種類){
  var 枠 = document.getElementById('実物_'+id);
  枠.textContent = '読み込み中…';
  if(種類 === '写真'){
    call('添付_写真', ST.token, id).then(function(d){
      枠.innerHTML = '<img src="'+d+'" style="max-width:100%; border-radius:8px;">';
    }).catch(function(e){ if(!切れた(e)) 枠.textContent = (e && e.message); });
  } else {
    call('添付_動画', ST.token, id).then(function(u){
      枠.innerHTML = '<iframe src="'+esc(u)+'" style="width:100%; height:240px; border:0; border-radius:8px;" allow="autoplay"></iframe>';
    }).catch(function(e){ if(!切れた(e)) 枠.textContent = (e && e.message); });
  }
}

function 添付を取り出す(id){
  if(!confirm('事務所のPCから取り出します。\n数分で見られるようになります。よろしいですか？')) return;
  call('管理_添付取り出し', ST.token, id).then(function(r){
    var 枠 = document.getElementById('実物_'+id);
    枠.textContent = r.依頼した ? '取り出しています。数分後にもう一度開いてください。'
                  : (r.待ち ? 'すでに取り出し中です。もう少しお待ちください。' : 'もう見られます。開き直してください。');
  }).catch(function(e){ if(!切れた(e)) alert((e && e.message)); });
}

function admQrPdf(全員){
  var ids = [];
  if(!全員){
    Array.prototype.forEach.call(document.querySelectorAll('#admBody input.qrpick:checked'), function(c){ ids.push(c.value); });
    if(!ids.length){ show('admMsg','カードを作るかたを選んでください'); return; }
  }
  show('admMsg','');
  document.getElementById('qrOut').textContent = 'PDFを作っています…（人数が多いと少し時間がかかります）';
  call('管理_QRカードPDF', ST.token, ids).then(function(r){
    document.getElementById('qrOut').innerHTML =
      esc(r.件数) + '名ぶんのカードを作りました。<br><a href="'+esc(r.url)+'" target="_blank" rel="noopener">GoogleドライブでPDFを開く</a>'
      + '<div class="note">A4に1人1枚で並んでいます。印刷して切り取り線で切り分け、ご本人にお渡しください。'
      + (r.共有先 && r.共有先.length ? '<br>次のアドレスにも閲覧権限を付けました：' + esc(r.共有先.join('、')) : '') + '</div>';
  }).catch(function(e){ if(!切れた(e)) document.getElementById('qrOut').textContent = (e && e.message); });
}
function admQrReset(id){
  if(!confirm('このかたのQRを作り直します。\n今までお渡ししたカードは、その場で使えなくなります。よろしいですか？')) return;
  call('管理_QR作り直す', ST.token, id)
    .then(function(){ setAdm('staff'); show('admMsg','QRを作り直しました。「QRカード」タブから新しいカードを出してお渡しください','ok'); })
    .catch(function(e){ if(!切れた(e)) show('admMsg', (e && e.message)); });
}
/** 作ったCSVを覚えておく（保存ボタンを押したときに使う） */
var 作ったCSV = null;

/**
 * CSVをこの端末に保存する（Googleアカウントは要らない）。
 * ★先頭に \ufeff（見えない印）を付ける。付けないとExcelが日本語を文字化けさせる。
 */
function CSVを保存する(){
  if(!作ったCSV || !作ったCSV.本文){ show('admMsg','保存できる中身がありません'); return; }
  try {
    var b = new Blob(['\ufeff' + 作ったCSV.本文], { type: 'text/csv;charset=utf-8;' });
    var u = URL.createObjectURL(b);
    var a = document.createElement('a');
    a.href = u;
    a.download = 作ったCSV.名前 || '申し送り.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ try { URL.revokeObjectURL(u); } catch(e){} }, 3000);
    show('admMsg','保存しました（端末のダウンロード先をご確認ください）','ok');
  } catch(e){
    show('admMsg','この端末では直接保存できませんでした。下の「Googleドライブで開く」をお使いください');
  }
}
/** 選ぶ形の入れ物を作る。いまの値が候補に無ければ、その値も先頭に足しておく（勝手に変えないため） */
function 設定の選び方_(項目, 候補, いま){
  var ある = false;
  候補.forEach(function(c){ if(String(c.値).toUpperCase() === String(いま).toUpperCase()) ある = true; });
  var 全部 = ある ? 候補 : [{名:'いまの値（' + いま + '）', 値:String(いま)}].concat(候補);
  return '<select data-set="' + esc(項目) + '">'
    + 全部.map(function(c){
        var 選 = (String(c.値).toUpperCase() === String(いま).toUpperCase()) ? ' selected' : '';
        return '<option value="' + esc(c.値) + '"' + 選 + '>' + esc(c.名) + '</option>';
      }).join('') + '</select>';
}
/** 変えたところだけを、1つずつ順に保存する */
function admSaveSettings(){
  var 変更 = [];
  Array.prototype.forEach.call(document.querySelectorAll('#admBody [data-set]'), function(el){
    var 項目 = el.getAttribute('data-set');
    if(String(el.value) !== String(ST.設定元[項目])) 変更.push({ 項目: 項目, 値: String(el.value) });
  });
  if(!変更.length){ show('admMsg','変えたところがありません'); return; }
  show('admMsg', '保存しています…（' + 変更.length + '件）');
  var 済 = [], だめ = [];
  var p = Promise.resolve();
  変更.forEach(function(c){
    p = p.then(function(){
      return call('管理_設定更新', ST.token, c.項目, c.値).then(function(r){
        済.push(c.項目 + '：' + (r.前 === '' ? '（空）' : r.前) + ' → ' + r.値);
      }).catch(function(e){
        if(切れた(e)) throw e;
        だめ.push(c.項目 + '：' + (e && e.message));
      });
    });
  });
  p.then(function(){
    setAdm('setting');
    var 文 = (済.length ? '変えました　' + 済.join('／') : '');
    if(だめ.length) 文 += (文 ? '　' : '') + '変えられなかったもの　' + だめ.join('／');
    show('admMsg', 文, だめ.length ? 'err' : 'ok');
  }).catch(function(e){ if(!切れた(e)) show('admMsg', (e && e.message)); });
}
function admCsv(){
  document.getElementById('csvOut').textContent = '作成中…';
  作ったCSV = null;
  call('管理_CSV出力', ST.token, document.getElementById('cFrom').value, document.getElementById('cTo').value)
    .then(function(r){
      作ったCSV = r;
      var h = esc(r.件数) + '件を出力しました。';
      if(r.本文){
        h += '<div class="sp"></div>'
           + '<button class="btn" onclick="CSVを保存する()">この端末に保存する</button>'
           + '<div class="note">Googleアカウントは要りません。Excelでそのまま開けます。</div>';
      }
      h += '<div class="note" style="margin-top:10px;">'
         + '<a href="'+esc(r.url)+'" target="_blank" rel="noopener">Googleドライブの控えを開く</a>（アカウントが要ります）</div>'
         + '<div class="note">'+esc(r.注意)+'</div>';
      document.getElementById('csvOut').innerHTML = h;
    }).catch(function(e){ if(!切れた(e)) document.getElementById('csvOut').textContent = (e && e.message); });
}
